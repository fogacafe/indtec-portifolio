name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: fogacafe/indtec-labz-planner
          ref: main
          path: .labz/planner
      - working-directory: .labz/planner
        run: npm install && npm run build
      - run: mkdir -p dist/labz/planner && cp -R .labz/planner/dist/. dist/labz/planner/
      - uses: actions/checkout@v4
        with:
          repository: fogacafe/indtec-labz-drums
          ref: main
          path: .labz/drums
      - working-directory: .labz/drums
        run: npm install && npm run build
      - run: mkdir -p dist/drums && cp -R .labz/drums/dist/. dist/drums/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
